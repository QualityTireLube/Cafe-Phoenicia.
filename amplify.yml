version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing Python dependencies..."
        - pip3 install --upgrade pip
    build:
      commands:
        - echo "Building offline site..."
        - python3 build_fully_offline.py
        - echo "Fixing asset paths for Amplify..."
        - python3 fix_paths_for_amplify.py
        - echo "Build complete!"
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
